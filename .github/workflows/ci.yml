name: Nix

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      - name: Check Apple Silicon runner
        run: test "$(uname -m)" = arm64
      - name: Build and test without model files
        run: nix flake check --print-build-logs
      - name: Check installed commands without model files
        run: |
          nix run . -- --help
          nix run .#download-model -- --help
          nix run .#serve -- --help
          nix develop --command make all test test-tools
